[project]
name = "tlmn-backend"
version = "0.1.0"
description = "Backend FastAPI (REST + WebSocket) cho Tiến Lên Miền Nam online"
requires-python = ">=3.12"
dependencies = [
    "tlmn-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
]

[tool.uv.sources]
tlmn-engine = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
