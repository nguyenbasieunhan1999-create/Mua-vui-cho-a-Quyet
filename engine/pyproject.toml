[project]
name = "tlmn-engine"
version = "0.1.0"
description = "Rules engine Tiến Lên Miền Nam: Python thuần, deterministic, không phụ thuộc framework/DB"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlmn_engine"]
