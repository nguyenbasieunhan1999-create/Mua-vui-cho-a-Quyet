[project]
name = "tienlenmiennam"
version = "0.1.0"
description = "Tiến Lên Miền Nam online — workspace gốc (engine + backend + tools)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine", "backend"]

[dependency-groups]
dev = [
    "tlmn-engine",
    "tlmn-backend",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "httpx>=0.27",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "openpyxl>=3.1",
    "types-openpyxl>=3.1",
]

[tool.uv.sources]
tlmn-engine = { workspace = true }
tlmn-backend = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["engine/tests", "backend/tests", "tools/tests"]
pythonpath = ["backend", "engine/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120  # test WebSocket không được treo vô hạn
markers = [
    "rule(*excel_ids): test kiểm tra các Excel rule ID tương ứng (dùng cho tools/check_rule_trace.py)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # cho phép ký tự tiếng Việt và ♠♣♦♥ trong chuỗi/comment

[tool.ruff.lint.isort]
known-first-party = ["app", "tlmn_engine", "tlmn_testkit", "tests", "test_property"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["engine/src", "tools", "backend/src"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async chạy trong greenlet
