# Triển khai (staging / production): docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Xem deploy/.env.example và docs/runbook.md.
name: tlmn

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tlmn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong deploy/.env}
      POSTGRES_DB: tlmn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tlmn -d tlmn"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+asyncpg://tlmn:${POSTGRES_PASSWORD}@db:5432/tlmn
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Đặt ALLOWED_ORIGINS, vd ["https://tlmn.example.com"]}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ROOM_LOOKUP_PER_MINUTE: ${ROOM_LOOKUP_PER_MINUTE:-30}  # chỉ nới khi chạy kiểm thử tải
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: tlmn
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: tlmn
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./backup:/scripts:ro
    entrypoint: ["sh", "/scripts/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
